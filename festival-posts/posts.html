<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Osho Festival Posts</title>
<style>
@font-face{font-family:Corm;src:url(assets/fonts/CormorantGaramond-500.ttf);font-weight:500}
@font-face{font-family:Corm;src:url(assets/fonts/CormorantGaramond-600.ttf);font-weight:600}
@font-face{font-family:Corm;src:url(assets/fonts/CormorantGaramond-700.ttf);font-weight:700}
@font-face{font-family:Corm;src:url(assets/fonts/CormorantGaramond-500i.ttf);font-weight:500;font-style:italic}
@font-face{font-family:Corm;src:url(assets/fonts/CormorantGaramond-600i.ttf);font-weight:600;font-style:italic}
@font-face{font-family:Cinzel;src:url(assets/fonts/Cinzel-500.ttf);font-weight:500}
@font-face{font-family:Cinzel;src:url(assets/fonts/Cinzel-600.ttf);font-weight:600}
@font-face{font-family:Fraunces;src:url(assets/fonts/Fraunces-700.ttf);font-weight:700}
@font-face{font-family:Tiro;src:url(assets/fonts/TiroDevanagariHindi-400.ttf)}
@font-face{font-family:Poppins;src:url(assets/fonts/Poppins-Regular.ttf);font-weight:400}
@font-face{font-family:Poppins;src:url(assets/fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:Poppins;src:url(assets/fonts/Poppins-SemiBold.ttf);font-weight:600}

*{box-sizing:border-box;margin:0;padding:0}
body{background:#777;display:flex;flex-direction:column;gap:40px;padding:40px;align-items:center}
.post{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Poppins}
.post>svg.scene{position:absolute;inset:0}
.layer{position:absolute;left:0;right:0;text-align:center}

/* titles */
.hi{font-family:Tiro;font-size:104px;line-height:1.25}
.en{font-family:Cinzel;font-weight:500;font-size:28px;letter-spacing:.42em;display:flex;align-items:center;justify-content:center;gap:22px}
.en i{display:block;width:70px;height:1px}
.en b{font-weight:500;margin-right:-.42em}
.msg{font-family:Corm;font-style:italic;font-weight:500;font-size:35px;line-height:1.25;padding:0 130px}
.sign{font-family:Cinzel;font-size:17px;letter-spacing:.3em;margin-top:10px}

/* footer */
.foot{position:absolute;left:0;right:0;bottom:0;height:300px;text-align:center}
.foot .brand{position:absolute;left:0;right:0;top:28px;display:flex;justify-content:center}
.foot .brand img{height:76px}
.foot .cols{position:absolute;left:70px;right:70px;top:124px;display:grid;grid-template-columns:1fr 1px 1fr;gap:30px;text-align:left}
.foot .cols .rule{width:1px}
.foot h6{font-family:Poppins;font-weight:600;font-size:16px;letter-spacing:.18em;margin-bottom:6px}
.foot p{font-size:17px;line-height:1.5;font-weight:400}
.foot .contact{position:absolute;left:0;right:0;bottom:20px;font-size:21px;font-weight:500;letter-spacing:.04em;display:flex;justify-content:center;gap:12px;align-items:center}
.foot .contact svg{width:20px;height:20px}

/* Osho Signature logo, as in the product guide: Fraunces bold, "Signature" in brass */
.osho-title{font-family:Fraunces;font-weight:700;font-size:78px;line-height:1;color:#F2EFE4;letter-spacing:-.005em}
.osho-title em{font-style:normal;color:#E3B463}
/* Osho Signature wordmark (unused) */
.wordmark{font-family:Cinzel;font-weight:600;font-size:40px;letter-spacing:.34em;display:flex;align-items:center;gap:22px;margin-right:-.34em}
.wordmark i{display:block;width:60px;height:1px}
.wordmark small{display:block;font-family:Corm;font-style:italic;font-weight:500;font-size:20px;letter-spacing:.06em;margin-top:2px}

/* themes */
.decor{color:#F6EEDC}
.decor .hi{background:linear-gradient(180deg,#FFE7A3 10%,#E7B04A 60%,#C98A2C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.decor .en{color:#F6EEDC}
.decor .en i{background:linear-gradient(90deg,transparent,#E20886)}
.decor .en i:last-child{background:linear-gradient(90deg,#E20886,transparent)}
.decor .msg{color:#F3E7CF}
.decor .sign{color:#E7B04A;opacity:.9}
.decor .foot{background:rgba(6,7,16,.55);border-top:1px solid rgba(231,176,74,.55)}
.decor .foot h6{color:#E7B04A}
.decor .foot p{color:#E9E2D2}
.decor .foot .rule{background:rgba(231,176,74,.4)}
.decor .foot .contact{color:#FFFFFF}

.sig{color:#1F2A44}
.sig .hi{background:linear-gradient(180deg,#C9A24E 0%,#A27A2A 55%,#7E5C1C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sig .en{color:#1F2A44}
.sig .en i{background:linear-gradient(90deg,transparent,#A27A2A)}
.sig .en i:last-child{background:linear-gradient(90deg,#A27A2A,transparent)}
.sig .msg{color:#2B3350}
.sig .sign{color:#A27A2A}
.sig .foot{background:linear-gradient(180deg,#12141C 0%,#1E2230 100%);border-top:3px solid #C98A2C}
.sig .foot h6{color:#D8B66A}
.sig .foot p{color:#E8E2D4}
.sig .foot .rule{background:rgba(216,182,106,.45)}
.sig .foot .contact{color:#FFFFFF}
.foot.slim .brand{top:78px}
.foot.slim .brand img{height:104px}
.foot.slim .contact{bottom:58px;font-size:23px}
.sig .wordmark{color:#E2C47F}
.sig .wordmark i{background:#B8923F}
.sig .wordmark small{color:#E8E2D4}
</style>
</head>
<body>
<div id="root"></div>
<script>
const W = 1080, H = 1350;
</script>
<script src="assets/motifs.js"></script>
<script>

/* ------------------------------------------------------------------ shared text + footer */
const ADDRESS = {
  showroomTitle: 'OSHO INTERNATIONAL',
  showroom: ['1/29, 2nd Floor, WHS Timber Market,', 'Opp. Richi Rich Banquet, Near Mayapuri', 'Metro Station, Delhi 110015'],
  warehouseTitle: 'OUR WAREHOUSE',
  warehouse: ['Plot No. 11, Sector 25 Part 2,', 'Industrial Area, Sector 25,', 'Panipat, Haryana 132104'],
  phone: '+91 98105 27231',
};
const phoneIcon = c => `<svg viewBox="0 0 24 24"><path fill="${c}" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>`;

function footer(brandHtml, iconColor, withAddress = true) {
  if (!withAddress) return `<div class="foot slim">
    <div class="brand">${brandHtml}</div>
    <div class="contact">${phoneIcon(iconColor)}<span>CONTACT : ${ADDRESS.phone}</span></div>
  </div>`;
  return `<div class="foot">
    <div class="brand">${brandHtml}</div>
    <div class="cols">
      <div><h6>ADDRESS : ${ADDRESS.showroomTitle}</h6><p>${ADDRESS.showroom.join('<br>')}</p></div>
      <div class="rule"></div>
      <div><h6>${ADDRESS.warehouseTitle}</h6><p>${ADDRESS.warehouse.join('<br>')}</p></div>
    </div>
    <div class="contact">${phoneIcon(iconColor)}<span>CONTACT : ${ADDRESS.phone}</span></div>
  </div>`;
}
const decorBrand = `<img src="assets/osho-decor-logo-white.png" alt="Osho Decor">`;
const sigBrand = `<div class="osho-title">Osho <em>Signature</em></div>`;   // product-guide logo; no address on Signature posts

function titles(top, hi, en) {
  return `<div class="layer" style="top:${top}px"><div class="hi">${hi}</div>
    <div class="en"><i></i><b>${en}</b><i></i></div></div>`;
}
function message(top, text, sign) {
  return `<div class="layer" style="top:${top}px"><p class="msg">${text}</p><p class="sign">${sign}</p></div>`;
}

/* ------------------------------------------------------------------ the six posts */
const posts = [];

// 1. Osho Decor - Dussehra
posts.push({ name: 'osho-decor-dussehra', cls: 'decor', html: () => {
  const bg = id('bg');
  const svg = `<svg class="scene" viewBox="0 0 ${W} ${H}">
    <defs><radialGradient id="${bg}" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#2B2347"/><stop offset=".6" stop-color="#16152E"/><stop offset="1" stop-color="#0C0C1C"/></radialGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#${bg})"/>
    ${stars(70, 30, 120, 1050, 1060, '#F6EEDC')}
    ${glow(540, 630, 420, '#F5A623', .38)}
    ${rays(540, 630, 150, 500, 40, '#F5B647', .10)}
    <circle cx="540" cy="630" r="236" fill="none" stroke="#E7B04A" stroke-width="1.5" opacity=".55"/>
    <circle cx="540" cy="630" r="252" fill="none" stroke="#E7B04A" stroke-width="1" stroke-dasharray="2 8" opacity=".6"/>
    ${bow(470, 640, .92, -28)}
    ${toran(W, 0, 6, 34)}
    ${[[140, 880], [940, 880]].map(([x, y]) => diya(x, y, .62)).join('')}
  </svg>`;
  return svg + titles(150, 'शुभ दशहरा', 'Happy Dussehra')
    + message(918, 'May the triumph of good over evil fill your life<br>with courage, truth and success.', '— Warm wishes from Osho Decor —')
    + footer(decorBrand, '#E7B04A');
} });

// 2. Osho Decor - Dhanteras
posts.push({ name: 'osho-decor-dhanteras', cls: 'decor', html: () => {
  const bg = id('bg');
  let coins = '';
  [[330, 832, 34, 6], [750, 836, 34, 8], [396, 866, 28, 3], [690, 872, 28, 4]].forEach(([x, y, r, n]) => coins += coinStack(x, y, r, n));
  [[455, 878], [500, 888], [585, 886], [628, 878], [540, 896], [262, 870], [818, 874]].forEach(([x, y]) => coins += coin(x, y, 24));
  const svg = `<svg class="scene" viewBox="0 0 ${W} ${H}">
    <defs><radialGradient id="${bg}" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#4A1630"/><stop offset=".6" stop-color="#2A0E1E"/><stop offset="1" stop-color="#160711"/></radialGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#${bg})"/>
    ${stars(60, 30, 40, 1050, 1060, '#FFE3A0')}
    ${rangoli(540, 620, 290, ['#E20886', '#E7B04A', '#F6EEDC', '#E7B04A'])}
    <circle cx="540" cy="620" r="188" fill="#2A0E1E" opacity=".75"/>
    ${kalash(540, 690, 1.02)}
    ${coins}
    ${diya(160, 820, .74)}${diya(920, 820, .74)}
    ${[[110, 420], [970, 460], [200, 300], [880, 300]].map(([x, y]) => sparkle(x, y, 14, '#FFE3A0', .9)).join('')}
  </svg>`;
  return svg + titles(70, 'शुभ धनतेरस', 'Happy Dhanteras')
    + message(922, 'May Goddess Lakshmi bless your home and business<br>with health, wealth and prosperity.', '— Warm wishes from Osho Decor —')
    + footer(decorBrand, '#E7B04A');
} });

// 3. Osho Decor - Diwali
posts.push({ name: 'osho-decor-diwali', cls: 'decor', html: () => {
  const bg = id('bg');
  const svg = `<svg class="scene" viewBox="0 0 ${W} ${H}">
    <defs><radialGradient id="${bg}" cx=".5" cy=".55" r=".8"><stop offset="0" stop-color="#22264F"/><stop offset=".6" stop-color="#141633"/><stop offset="1" stop-color="#0A0B1C"/></radialGradient></defs>
    <rect width="${W}" height="${H}" fill="url(#${bg})"/>
    ${stars(90, 20, 20, 1060, 1060, '#F6EEDC')}
    ${firework(170, 420, 80, '#E20886')}${firework(915, 400, 70, '#2CC6B4')}${firework(900, 600, 44, '#E7B04A')}${firework(185, 620, 40, '#E7B04A')}
    ${lantern(105, 120, 40, .9)}${lantern(975, 160, 40, .9, '#2C8C86', '#F4B740')}
    ${rangoli(540, 650, 250, ['#E20886', '#E7B04A', '#2CC6B4', '#F6EEDC'])}
    ${diya(540, 662, 1.2)}
    ${[[300, 848, .78], [425, 872, .84], [655, 872, .84], [780, 848, .78]].map(([x, y, s]) => diya(x, y, s)).join('')}
  </svg>`;
  return svg + titles(180, 'शुभ दीपावली', 'Happy Diwali')
    + message(922, 'May the glow of diyas fill your home with happiness,<br>peace and vibrant new beginnings.', '— Warm wishes from Osho Decor —')
    + footer(decorBrand, '#E7B04A');
} });

// Osho Signature: ivory room, navy drapes, arched window with the festival scene
function sigScene(inner, archFill) {
  const bg = id('bg'), cl = id('cl');
  const ax0 = 300, ax1 = 780, ay0 = 318, ay1 = 872;
  return `<svg class="scene" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="${bg}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F2E7"/><stop offset="1" stop-color="#EAE1CF"/></linearGradient>
      <clipPath id="${cl}"><path d="${arch(ax0, ay0, ax1, ay1)}"/></clipPath></defs>
    <rect width="${W}" height="${H}" fill="url(#${bg})"/>
    ${Array.from({ length: 60 }, (_, i) => `<line x1="0" y1="${i * 18}" x2="${W}" y2="${i * 18}" stroke="#D9CDB4" stroke-width=".6" opacity=".35"/>`).join('')}
    <path d="${arch(ax0 - 26, ay0 - 26, ax1 + 26, ay1 + 8)}" fill="#E8DCC2" stroke="#B8923F" stroke-width="2"/>
    <path d="${arch(ax0, ay0, ax1, ay1)}" fill="${archFill}"/>
    <g clip-path="url(#${cl})">${inner}</g>
    <path d="${arch(ax0, ay0, ax1, ay1)}" fill="none" stroke="#B8923F" stroke-width="5"/>
    <path d="${arch(ax0 - 14, ay0 - 14, ax1 + 14, ay1)}" fill="none" stroke="#B8923F" stroke-width="1.5"/>
    <rect x="${ax0 - 40}" y="${ay1}" width="${ax1 - ax0 + 80}" height="22" fill="#1F2A44"/><rect x="${ax0 - 40}" y="${ay1}" width="${ax1 - ax0 + 80}" height="4" fill="#B8923F"/>
    ${drapes(0, 1052)}
  </svg>`;
}

// 4. Osho Signature - Dussehra
posts.push({ name: 'osho-signature-dussehra', cls: 'sig', html: () => {
  const sky = id('sk');
  const inner = `<defs><linearGradient id="${sky}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F2A44"/><stop offset=".55" stop-color="#7A4B4E"/><stop offset="1" stop-color="#E59A4B"/></linearGradient></defs>
    <rect x="0" y="0" width="${W}" height="${H}" fill="url(#${sky})"/>
    ${stars(40, 300, 318, 780, 580, '#FFF4D6')}
    ${glow(540, 750, 260, '#FFC766', .55)}
    ${bow(505, 612, .72, -30, '#E2C47F', '#FFF4D6', true, '#B8923F')}`;
  return sigScene(inner, '#1F2A44') + titles(104, 'शुभ दशहरा', 'Happy Dussehra')
    + message(916, 'As good triumphs over evil, may your home<br>be filled with grace and lasting joy.', '— Osho Signature —')
    + footer(sigBrand, '#D8B66A', false);
} });

// 5. Osho Signature - Dhanteras
posts.push({ name: 'osho-signature-dhanteras', cls: 'sig', html: () => {
  let coins = '';
  [[420, 848, 30, 7], [660, 848, 30, 9], [470, 862, 24, 3], [612, 864, 24, 4]].forEach(([x, y, r, n]) => coins += coinStack(x, y, r, n));
  [[520, 868], [565, 866]].forEach(([x, y]) => coins += coin(x, y, 22));
  const inner = `<rect x="0" y="0" width="${W}" height="${H}" fill="#1F2A44"/>
    ${stars(40, 300, 330, 780, 640, '#FFF4D6')}
    ${rangoli(540, 628, 228, ['#B8923F', '#D8B66A', '#E8E2D4', '#D8B66A'])}
    <circle cx="540" cy="628" r="150" fill="#1F2A44" opacity=".8"/>
    ${kalash(540, 702, .88)}
    ${coins}`;
  return sigScene(inner, '#1F2A44') + titles(104, 'शुभ धनतेरस', 'Happy Dhanteras')
    + message(916, 'May prosperity and good fortune find their way<br>into every corner of your home.', '— Osho Signature —')
    + footer(sigBrand, '#D8B66A', false);
} });

// 6. Osho Signature - Diwali
posts.push({ name: 'osho-signature-diwali', cls: 'sig', html: () => {
  const sky = id('sk');
  const inner = `<defs><linearGradient id="${sky}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121A30"/><stop offset="1" stop-color="#2A3560"/></linearGradient></defs>
    <rect x="0" y="0" width="${W}" height="${H}" fill="url(#${sky})"/>
    ${stars(70, 300, 330, 780, 860, '#FFF4D6')}
    ${firework(430, 480, 70, '#E2C47F')}${firework(660, 430, 56, '#F2D9A0')}${firework(610, 620, 40, '#E2C47F')}${firework(420, 660, 32, '#F2D9A0')}
    <rect x="300" y="806" width="480" height="66" fill="#0E1426" opacity=".6"/>
    ${[[395, 836, .64], [540, 826, .8], [685, 836, .64]].map(([x, y, s]) => diya(x, y, s, ['#C9A24E', '#7E5C1C'], '#F2D9A0')).join('')}`;
  return sigScene(inner, '#121A30') + titles(104, 'शुभ दीपावली', 'Happy Diwali')
    + message(916, 'May your home glow with light, love<br>and timeless elegance this Diwali.', '— Osho Signature —')
    + footer(sigBrand, '#D8B66A', false);
} });

const root = document.getElementById('root');
for (const p of posts) {
  const s = document.createElement('section');
  s.className = `post ${p.cls}`;
  s.id = p.name;
  s.innerHTML = p.html();
  root.appendChild(s);
}
document.fonts.ready.then(() => document.body.setAttribute('data-ready', '1'));
</script>
</body>
</html>
