<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dhanteras Lakshmi Posts</title>
<style>
@font-face{font-family:Corm;src:url(assets/fonts/CormorantGaramond-500.ttf);font-weight:500}
@font-face{font-family:Corm;src:url(assets/fonts/CormorantGaramond-500i.ttf);font-weight:500;font-style:italic}
@font-face{font-family:Corm;src:url(assets/fonts/CormorantGaramond-600i.ttf);font-weight:600;font-style:italic}
@font-face{font-family:Cinzel;src:url(assets/fonts/Cinzel-500.ttf);font-weight:500}
@font-face{font-family:Cinzel;src:url(assets/fonts/Cinzel-600.ttf);font-weight:600}
@font-face{font-family:Tiro;src:url(assets/fonts/TiroDevanagariHindi-400.ttf)}
@font-face{font-family:Fraunces;src:url(assets/fonts/Fraunces-700.ttf);font-weight:700}
@font-face{font-family:Poppins;src:url(assets/fonts/Poppins-Regular.ttf);font-weight:400}
@font-face{font-family:Poppins;src:url(assets/fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:Poppins;src:url(assets/fonts/Poppins-SemiBold.ttf);font-weight:600}

*{box-sizing:border-box;margin:0;padding:0}
body{background:#777;display:flex;flex-direction:column;gap:40px;padding:40px;align-items:center}
.post{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Poppins}
.post>svg{position:absolute;inset:0}
.layer{position:absolute;left:0;right:0;text-align:center}

.hi{font-family:Tiro;font-size:96px;line-height:1.2;-webkit-background-clip:text;background-clip:text;color:transparent}
.en{font-family:Cinzel;font-weight:500;font-size:26px;letter-spacing:.46em;margin-right:-.46em;display:flex;align-items:center;justify-content:center;gap:22px}
.en i{display:block;width:70px;height:1.5px}
.art{position:absolute;left:215px;top:262px;width:650px;height:654px;mix-blend-mode:multiply}
.msg{font-family:Corm;font-style:italic;font-weight:500;font-size:37px;line-height:1.28;padding:0 120px}
.sign{font-family:Cinzel;font-size:17px;letter-spacing:.3em;margin-top:12px}
.frame{position:absolute;inset:30px;pointer-events:none}

/* footer */
.foot{position:absolute;left:0;right:0;bottom:0;text-align:center;color:#fff}
.foot .contact{font-size:21px;font-weight:500;letter-spacing:.04em;display:flex;justify-content:center;gap:12px;align-items:center}
.foot .contact svg{width:20px;height:20px}

/* ---------- Osho Decor: ivory, brand pink and gold ---------- */
.decor{background:#FBF5EA}
.decor .hi{background-image:linear-gradient(180deg,#E7B04A 10%,#C98A2C 55%,#9A6516 100%)}
.decor .en{color:#7A1450}
.decor .en i{background:linear-gradient(90deg,transparent,#E20886)}
.decor .en i:last-child{background:linear-gradient(90deg,#E20886,transparent)}
.decor .msg{color:#3A2230}
.decor .sign{color:#C2186B}
.decor .frame{border:2px solid #D9A645;bottom:276px}
.decor .frame:after{content:"";position:absolute;inset:8px;border:1px solid rgba(226,8,134,.35)}
.decor .foot{height:262px;background:linear-gradient(180deg,#2A1638,#1C0E26);border-top:4px solid #E20886}
.decor .foot .logo{margin-top:26px;height:72px}
.decor .foot .cols{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin:14px 80px 0;text-align:center}
.decor .foot h6{font-weight:600;font-size:15px;letter-spacing:.18em;color:#E7B04A;margin-bottom:4px}
.decor .foot p{font-size:15.5px;line-height:1.45;color:#E9E2D2}
.decor .foot .contact{position:absolute;left:0;right:0;bottom:18px}

/* ---------- Osho Signature: ivory, ink and brass ---------- */
.sig{background:#F4EFE3}
.sig .hi{background-image:linear-gradient(180deg,#C9A24E 0%,#A27A2A 55%,#7E5C1C 100%)}
.sig .en{color:#12141C}
.sig .en i{background:linear-gradient(90deg,transparent,#A27A2A)}
.sig .en i:last-child{background:linear-gradient(90deg,#A27A2A,transparent)}
.sig .msg{color:#1E2230}
.sig .sign{color:#A27A2A}
.sig .frame{border:2px solid #12141C;bottom:230px}
.sig .frame:after{content:"";position:absolute;inset:8px;border:1px solid rgba(162,122,42,.6)}
.sig .foot{height:200px;background:linear-gradient(180deg,#12141C,#1E2230);border-top:3px solid #C98A2C;display:flex;flex-direction:column;justify-content:center;gap:22px}
.sig .osho-title{font-family:Fraunces;font-weight:700;font-size:70px;line-height:1;color:#F2EFE4}
.sig .osho-title em{font-style:normal;color:#E3B463}
</style>
</head>
<body>
<script>const W = 1080, H = 1350;</script>
<script src="assets/motifs.js"></script>
<script>
const phone = c => `<svg viewBox="0 0 24 24"><path fill="${c}" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>`;

function scene(glowA, glowB, ringColor) {
  const sp = [[120, 330], [960, 360], [175, 610], [905, 640], [140, 470], [940, 500]]
    .map(([x, y], i) => sparkle(x, y, i % 2 ? 11 : 15, '#D9A645', .8)).join('');
  return `<svg viewBox="0 0 ${W} ${H}">
    ${glow(540, 600, 430, glowA, .30)}${glow(540, 640, 300, glowB, .25)}
    <circle cx="540" cy="590" r="345" fill="none" stroke="${ringColor}" stroke-width="1.5" opacity=".55"/>
    <circle cx="540" cy="590" r="362" fill="none" stroke="${ringColor}" stroke-width="1" stroke-dasharray="2 9" opacity=".7"/>
    ${sp}
    ${coinStack(200, 905, 30, 5)}${coin(258, 915, 20)}${diya(150, 880, .62)}
    ${coinStack(880, 905, 30, 6)}${coin(822, 915, 20)}${diya(930, 880, .62)}
  </svg>`;
}

const decor = `<section class="post decor" id="osho-decor-dhanteras-lakshmi">
  ${scene('#E20886', '#F5A623', '#D9A645')}
  <div class="frame"></div>
  <div class="layer" style="top:64px"><div class="hi">शुभ धनतेरस</div></div>
  <div class="layer" style="top:198px"><div class="en"><i></i>HAPPY DHANTERAS<i></i></div></div>
  <img class="art" src="assets/lakshmi.jpg" alt="Goddess Lakshmi">
  <div class="layer" style="top:922px"><p class="msg">May Goddess Lakshmi bless your home and business<br>with health, wealth and prosperity.</p><p class="sign">— Warm wishes from Osho Decor —</p></div>
  <div class="foot">
    <img class="logo" src="assets/osho-decor-logo-white.png" alt="Osho Decor">
    <div class="cols">
      <div><h6>OSHO INTERNATIONAL</h6><p>1/29, 2nd Floor, WHS Timber Market, Opp. Richi Rich<br>Banquet, Near Mayapuri Metro Station, Delhi 110015</p></div>
      <div><h6>OUR WAREHOUSE</h6><p>Plot No. 11, Sector 25 Part 2, Industrial Area,<br>Sector 25, Panipat, Haryana 132104</p></div>
    </div>
    <div class="contact">${phone('#E7B04A')}<span>CONTACT : +91 98105 27231</span></div>
  </div>
</section>`;

const sig = `<section class="post sig" id="osho-signature-dhanteras-lakshmi">
  ${scene('#C98A2C', '#E3B463', '#A27A2A')}
  <div class="frame"></div>
  <div class="layer" style="top:64px"><div class="hi">शुभ धनतेरस</div></div>
  <div class="layer" style="top:198px"><div class="en"><i></i>HAPPY DHANTERAS<i></i></div></div>
  <img class="art" src="assets/lakshmi.jpg" alt="Goddess Lakshmi">
  <div class="layer" style="top:960px"><p class="msg">May prosperity and good fortune find their way<br>into every corner of your home.</p><p class="sign">— Osho Signature —</p></div>
  <div class="foot">
    <div class="osho-title">Osho <em>Signature</em></div>
    <div class="contact">${phone('#E3B463')}<span>CONTACT : +91 98105 27231</span></div>
  </div>
</section>`;

document.body.insertAdjacentHTML('beforeend', decor + sig);
const imgs = [...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }));
Promise.all([document.fonts.ready, ...imgs]).then(() => document.body.setAttribute('data-ready', '1'));
</script>
</body>
</html>
