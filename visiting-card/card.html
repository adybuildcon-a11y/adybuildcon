<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Furnish Atellier - Visiting Card</title>
<style>
@font-face{font-family:Bodoni;src:url(assets/fonts/LibreBodoni-500.ttf);font-weight:500}
@font-face{font-family:Bodoni;src:url(assets/fonts/LibreBodoni-600.ttf);font-weight:600}
@font-face{font-family:Cinzel;src:url(assets/fonts/Cinzel-500.ttf);font-weight:500}
@font-face{font-family:Cinzel;src:url(assets/fonts/Cinzel-600.ttf);font-weight:600}
@font-face{font-family:Cinzel;src:url(assets/fonts/Cinzel-700.ttf);font-weight:700}
@font-face{font-family:Neuton;src:url(assets/fonts/Neuton-400.ttf);font-weight:400}
@page{size:8.5in 4.7708in;margin:0}
*{margin:0;padding:0}
body{background:#888}
.side{display:block;width:1275px;height:716px;margin:0 0 30px}
@media print{body{background:none}.side{margin:0;break-after:page}}
</style>
</head>
<body>
<!-- Layout measured from the original card (1275 x 716 at 150 dpi). Text uses textLength so widths match the original exactly. -->
<svg class="side" id="front" viewBox="0 0 1275 716" xmlns="http://www.w3.org/2000/svg">
  <rect width="1275" height="716" fill="#26303A"/>
  <rect y="241" width="1275" height="233" fill="#EAEBDD"/>
  <g fill="#E8E8DA">
    <text x="37" y="46" font-family="Neuton" font-size="21.4" textLength="107" lengthAdjust="spacing">SINCE 1994</text>
    <text x="309" y="216" font-family="Bodoni" font-weight="600" font-size="69.5" textLength="638" lengthAdjust="spacingAndGlyphs">The Furnish Atellier</text>
    <text x="241" y="529" font-family="Cinzel" font-weight="600" font-size="33" textLength="794" lengthAdjust="spacing">“Where Every Fabric Has a Purpose.”</text>
    <text x="241" y="569" font-family="Cinzel" font-weight="600" font-size="33" textLength="793" lengthAdjust="spacing">“Less Confusion. More Inspiration.”</text>
    <text x="820" y="683" font-family="Neuton" font-size="21.4" textLength="426" lengthAdjust="spacing">VENTURE UNDER ADY BUILDCON PVT. LTD.</text>
    <text id="f-osho" x="37" y="683" font-family="Neuton" font-size="21.4" letter-spacing="0.6">OSHO DECOR  ·  OSHO INTERNATIONAL</text>
  </g>
  <g fill="#26303A">
    <text x="326" y="360" font-family="Cinzel" font-weight="700" font-size="68.5" textLength="621" lengthAdjust="spacingAndGlyphs">KAMLESH AGRAWAL</text>
    <text x="296" y="417" font-family="Cinzel" font-weight="600" font-size="25.7" textLength="662" lengthAdjust="spacing">FOUNDER AND VISIONARY</text>
  </g>
</svg>

<svg class="side" id="back" viewBox="0 0 1275 716" xmlns="http://www.w3.org/2000/svg">
  <rect width="1275" height="716" fill="#26303A"/>
  <g fill="#E8E8DA">
    <text x="40" y="47" font-family="Neuton" font-size="21.4" letter-spacing="1.1">VENTURE UNDER ADY BUILDCON PVT. LTD.</text>
    <text x="114" y="325" font-family="Bodoni" font-weight="500" font-size="180" letter-spacing="-2">TFA</text>
    <!-- contact icon -->
    <g transform="translate(1 3.5)"><path d="M144,364 a22,21.5 0 1 1 -14,38 l-8,5 l3,-9.5 a22,21.5 0 0 1 19,-33.5z"/>
    <g fill="#26303A"><circle cx="144" cy="380" r="5.6"/><path d="M133.5,396 c0,-7 4.6,-10 10.5,-10 s10.5,3 10.5,10z"/></g></g>
    <!-- mail icon -->
    <g transform="translate(0 -5)"><rect x="121" y="427" width="48" height="34" rx="4"/>
    <path d="M124,431 l21,15 l21,-15" fill="none" stroke="#26303A" stroke-width="3" stroke-linejoin="round"/></g>
    <!-- globe icon -->
    <g fill="none" stroke="#E8E8DA" stroke-width="2.4" transform="translate(0 -4)"><circle cx="144.5" cy="493" r="17.5"/><ellipse cx="144.5" cy="493" rx="7.5" ry="17.5"/><path d="M127,493 h35 M130,484 h29 M130,502 h29 M144.5,475.5 v35"/></g>
    <text x="210" y="403" font-family="Neuton" font-size="44.5" letter-spacing=".5">+91 98105 27231</text>
    <text x="210" y="453" font-family="Neuton" font-size="44.5" letter-spacing=".5">adybuildcon@gmail.com</text>
    <text x="210" y="503" font-family="Neuton" font-size="44.5" letter-spacing=".5">www.tfaind.com</text>
    <text x="121" y="550" font-family="Neuton" font-size="38" letter-spacing=".4">Address: Ady Buildcon Pvt. Ltd.</text>
    <text x="121" y="594" font-family="Neuton" font-size="38" letter-spacing=".4">1/29, 2nd Floor, W.H.S. Rd, Timber Market, Kirti Nagar, New Delhi-110015</text>
    <text x="1235" y="684" text-anchor="end" font-family="Neuton" font-size="21.4" letter-spacing="1.1">SINCE 1994</text>
  </g>
  <!-- Osho brands, set opposite the TFA monogram on the same cap line -->
  <g id="b-osho">
    <line x1="640" y1="189" x2="640" y2="325" stroke="#E8E8DA" stroke-width="1.4" opacity=".55"/>
    <image href="assets/osho-decor-logo-ivory.png" x="724" y="196" width="440" height="84.2"/>
    <text x="947.5" y="325" text-anchor="middle" fill="#E8E8DA" font-family="Cinzel" font-weight="600" font-size="27" letter-spacing="7">OSHO INTERNATIONAL</text>
  </g>
</svg>
<script>
const imgs = [...document.querySelectorAll('image')].map(i => new Promise(r => { const t = new Image(); t.onload = t.onerror = r; t.src = i.getAttribute('href'); }));
if (location.hash === '#plain') document.querySelectorAll('#f-osho,#b-osho').forEach(e => e.remove());
Promise.all([document.fonts.ready, ...imgs]).then(() => (window.ext=[...document.querySelectorAll('text')].map(t=>{const b=t.getBBox();return [t.textContent.slice(0,22),Math.round(b.x),Math.round(b.x+b.width)]}), document.body.setAttribute('data-ready', '1')));
</script>
</body>
</html>
